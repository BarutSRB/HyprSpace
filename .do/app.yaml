name: omniwm-website
static_sites:
  - name: website
    environment_slug: node-js
    github:
      repo: BarutSRB/OmniWM
      branch: main
      deploy_on_push: true
    source_dir: website
    output_dir: dist
    error_document: 404.html
domains:
  - domain: omniwm.app
    type: PRIMARY
    minimum_tls_version: "1.2"
  - domain: www.omniwm.app
    type: ALIAS
    minimum_tls_version: "1.2"
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - match:
        authority:
          exact: www.omniwm.app
        path:
          prefix: /
      redirect:
        authority: omniwm.app
        scheme: https
        redirect_code: 308
    - component:
        name: website
      match:
        path:
          prefix: /
